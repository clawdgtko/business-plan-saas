name: CI - PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Worker checks
      - name: Install Worker Dependencies
        working-directory: ./worker
        run: npm ci

      - name: Lint Worker
        working-directory: ./worker
        run: npm run lint || echo "No lint script"

      - name: Type Check Worker
        working-directory: ./worker
        run: npm run typecheck || echo "No typecheck script"

      # Frontend checks
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint || echo "No lint script"

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test || echo "No tests yet"

  # Preview deploy for PRs
  deploy-preview:
    runs-on: ubuntu-latest
    needs: [lint-and-build, test]
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker Preview
        working-directory: ./worker
        run: |
          npm ci
          npx wrangler deploy --env preview || echo "Preview deploy skipped"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Preview deployment triggered!'
            })