name: 🧪 QA Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ==========================================
  # 1. Code Quality
  # ==========================================
  lint-and-format:
    name: 🎨 Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Run Prettier check
        run: npm run format:check
      
      - name: TypeScript check
        run: npm run typecheck

  # ==========================================
  # 2. Unit Tests
  # ==========================================
  unit-tests:
    name: 🧩 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests
        run: npm run test:unit -- --coverage
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/unit/lcov.info
          flags: unit
          fail_ci_if_error: false

  # ==========================================
  # 3. Integration Tests
  # ==========================================
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test

  # ==========================================
  # 4. Stripe Tests (CRITICAL)
  # ==========================================
  stripe-tests:
    name: 💳 Stripe Tests (CRITICAL)
    runs-on: ubuntu-latest
    # Toujours exécuter ces tests si du code billing est modifié
    if: |
      github.event_name == 'push' || 
      contains(github.event.pull_request.changed_files, 'billing') ||
      contains(github.event.pull_request.changed_files, 'stripe') ||
      contains(github.event.pull_request.changed_files, 'payment') ||
      contains(github.event.pull_request.changed_files, 'webhook')
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Stripe tests
        run: npm run test:stripe
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          NODE_ENV: test
      
      - name: Check Stripe test results
        if: failure()
        run: |
          echo "🚨 STRIPE TESTS FAILED - PAIEMENT POTENTIELLEMENT CASSÉ"
          echo "Cette PR ne peut pas être mergée sans correction"
          exit 1

  # ==========================================
  # 5. E2E Tests
  # ==========================================
  e2e-tests:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright
        run: npx playwright install --with-deps
      
      - name: Build application
        run: npm run build
      
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      
      - name: Upload E2E screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results/
          retention-days: 7

  # ==========================================
  # 6. Security Audit
  # ==========================================
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

  # ==========================================
  # 7. Coverage Report
  # ==========================================
  coverage:
    name: 📊 Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download unit coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage
          path: coverage/unit
      
      - name: Post coverage comment
        uses: codecov/codecov-action@v3
        with:
          flags: total
          fail_ci_if_error: false

  # ==========================================
  # 8. QA Gate
  # ==========================================
  qa-gate:
    name: 🚦 QA Gate
    runs-on: ubuntu-latest
    needs: [lint-and-format, unit-tests, integration-tests, stripe-tests, e2e-tests, security-audit]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint-and-format.result }}" != "success" ]] || \
             [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.integration-tests.result }}" != "success" ]] || \
             [[ "${{ needs.stripe-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.e2e-tests.result }}" != "success" ]]; then
            echo "🚨 QA GATE FAILED"
            exit 1
          fi
          echo "✅ QA GATE PASSED - Ready to merge"
