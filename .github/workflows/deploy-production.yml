name: Deploy - Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm production deployment'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  pre-deploy-checks:
    name: Pre-Deploy Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Verify release tag
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid release tag format"
            exit 1
          fi
      
      - name: Check CI status
        run: |
          # Verify that the commit passed CI
          echo "Checking CI status..."
        continue-on-error: true

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks]
    environment:
      name: production
      url: https://business-plan.app
    steps:
      - uses: actions/checkout@v4
      
      - name: Verify manual confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "Error: Manual confirmation required"
            exit 1
          fi
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json
      
      - name: Install dependencies
        working-directory: worker
        run: npm ci
      
      - name: Deploy to Cloudflare Workers (Production)
        working-directory: worker
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      
      - name: Apply database migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply business-plan-db-prod --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true
      
      - name: Smoke tests
        run: |
          sleep 5
          curl -f https://business-plan.app/health || exit 1
          curl -f https://business-plan.app/ || exit 1
      
      - name: Verify deployment
        run: |
          # Additional health checks
          echo "Running extended health checks..."
          curl -f https://business-plan.app/api/health || exit 1
      
      - name: Notify Slack - Success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#deployments'
          text: '🚀 Production deploy successful! Version: ${{ github.ref_name }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Notify Slack - Failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#alerts-critical'
          text: '🚨 Production deploy FAILED! Version: ${{ github.ref_name }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  rollback-on-failure:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy]
    if: failure()
    steps:
      - name: Trigger rollback
        run: |
          echo "Deployment failed - triggering rollback procedure"
          # In a real scenario, this would redeploy the previous version
          # For Workers, we can use wrangler rollback or redeploy previous version
      
      - name: Alert on-call
        run: |
          echo "Alerting on-call engineer..."
          # Integration with PagerDuty/Opsgenie would go here
