name = "apps-bpsaas"
main = "src/index.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "business-plan-db-prod"
database_id = "a46f68d5-0725-4f61-bb66-b7570af6a982"

[vars]
ENVIRONMENT = "production"

[env.staging]
name = "apps-bpsaas-staging"
vars = { ENVIRONMENT = "staging" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "business-plan-db-staging"
database_id = "a46f68d5-0725-4f61-bb66-b7570af6a982"

# Secrets à configurer avec wrangler secret put:
